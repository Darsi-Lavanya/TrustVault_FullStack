{% extends "base.html" %}{% block title %}Sign in · TrustVault{% endblock %}
{% block content %}<section class="form-card"><h1>Welcome back</h1><p class="muted">Sign in to access documents shared with you.</p>
<form method="post"><label>Username<input name="username" required autocomplete="username"></label><label>Password<input type="password" name="password" required autocomplete="current-password"></label><button class="btn full">Sign in</button></form>
<p class="small">New to TrustVault? <a href="{{ url_for('register') }}">Create an account</a></p></section>{% endblock %}
