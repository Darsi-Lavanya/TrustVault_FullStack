{% extends "base.html" %}{% block title %}Upload · TrustVault{% endblock %}
{% block content %}<section class="form-card wide"><a class="back" href="{{ url_for('documents') }}">← Documents</a><h1>Upload a document</h1><p class="muted">Maximum 10 MB. Allowed: PDF, Office documents, TXT, CSV and common images.</p>
<form method="post" enctype="multipart/form-data"><label>Choose file<input type="file" name="file" required accept=".pdf,.doc,.docx,.txt,.png,.jpg,.jpeg,.csv,.xlsx,.pptx"></label><label>Category<input name="category" maxlength="60" required placeholder="e.g. Contracts, HR, Audit"></label><label>Description<textarea name="description" maxlength="500" rows="3" placeholder="Optional context"></textarea></label><button class="btn">Upload securely</button></form></section>{% endblock %}
